[project]
name = "graduation-thesis-motion-detection"
version = "0.1.0"
description = "YOLOv8, DeepSORT and MediaPipe based motion detection prototype"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "easydict>=1.13,<2",
    "matplotlib>=3.6,<4",
    "mediapipe>=0.10.21,<0.10.30",
    "motmetrics>=1.4,<2",
    "opencv-contrib-python>=4.6,<5",
    "openpyxl>=3.1,<4",
    "pandas>=2,<3",
    "pillow>=10,<13",
    "pyyaml>=6,<7",
    "scipy>=1.10,<2",
    "torch>=2.1,<3",
    "torchvision>=0.16,<1",
    "ultralytics>=8.0,<9",
]

[dependency-groups]
debug = [
    "ipdb>=0.13,<1",
]

[tool.uv]
cache-dir = ".uv-cache"
package = false
python-preference = "only-managed"
required-version = ">=0.12.13"
