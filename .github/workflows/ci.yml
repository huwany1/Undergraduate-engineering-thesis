name: CI - P0 Baseline & Gate Validation

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  validate-and-test:
    name: Validate Contracts & Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.10
        run: uv python install 3.10

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Execute P0 Gate Verification Script
        run: uv run python scripts/verify_p0_gates.py

      - name: Run Pytest Test Suite
        run: uv run pytest -v tests/
